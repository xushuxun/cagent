<main>
  <h1>企业经营历史重放 · 前端原型</h1>
  <p class="sub">同一理念，三种形态。说与做对照陈列，全站无评判。</p>

  <a class="card" href="a_timeline.html">
    <h2>A · 双轨时间轴</h2>
    <p>左轨是管理层当年原话，右轨是当年行动与数字，按年对齐。并置即结构，适合通读。</p>
  </a>

  <a class="card" href="b_events.html">
    <h2>B · 决策事件流</h2>
    <p>按决策事件分章（出海、新能源、渠道变革），事件内逐年"说 / 做"对照。因果弧线最完整，适合深读。</p>
  </a>

  <a class="card" href="c_replay.html">
    <h2>C · 重放器</h2>
    <p>拖动时间轴或点播放，历史一年年展开：左边定格当年原话，右边数字逐年落定。"重放"感最强，适合演示。</p>
  </a>
</main>
<footer>数据说明：2025 年内容取自长城汽车真实年报；早年原话为示意，数字取自年报"近五年主要会计数据"。</footer>
