<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 B · 决策事件流</title>
<style>
  :root { --ink:#1c1b18; --mute:#8a8577; --paper:#faf8f3; --line:#e3ded2; --say:#3a5a8c; --do:#3d6b4f; }
  * { margin:0; box-sizing:border-box; }
  body { background:var(--paper); color:var(--ink); font-family:"Noto Serif SC","Songti SC",serif; line-height:1.8; }
  header { max-width:860px; margin:0 auto; padding:56px 32px 8px; }
  header h1 { font-size:26px; font-weight:600; }
  header p { color:var(--mute); font-size:13px; margin-top:6px; }
  nav { max-width:860px; margin:20px auto 0; padding:0 32px; display:flex; gap:10px; flex-wrap:wrap; }
  nav button { font:inherit; font-size:14px; padding:6px 18px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--mute); cursor:pointer; }
  nav button.on { border-color:var(--ink); color:var(--ink); }
  main { max-width:860px; margin:32px auto 80px; padding:0 32px; }
  .event { display:none; }
  .event.on { display:block; }
  .event h2 { font-size:20px; margin-bottom:4px; }
  .event .meta { color:var(--mute); font-size:13px; margin-bottom:28px; }
  .beat { border-top:1px solid var(--line); padding:22px 0; display:grid; grid-template-columns:72px 1fr; gap:20px; }
  .beat .y { font-variant-numeric:tabular-nums; color:var(--mute); font-size:14px; padding-top:3px; }
  blockquote { border-left:3px solid var(--say); padding:2px 0 2px 14px; font-size:15px; }
  blockquote footer { margin-top:8px; font-size:12px; color:var(--mute); }
  blockquote footer a { color:var(--say); text-decoration:none; border-bottom:1px dotted var(--say); }
  .did { margin-top:12px; font-size:15px; padding-left:14px; border-left:3px solid var(--do); }
  .did b { font-variant-numeric:tabular-nums; font-weight:600; }
  .did .src { display:block; font-size:12px; color:var(--mute); margin-top:4px; }
  .open { margin-top:28px; border:1px dashed var(--line); padding:16px 20px; font-size:14px; color:var(--mute); }
  footer.site { max-width:860px; margin:0 auto; padding:24px 32px 64px; color:var(--mute); font-size:12px; border-top:1px solid var(--line); }
</style>
</head>
<body>

<header>
  <h1>长城汽车 <span style="color:var(--mute);font-size:15px">经营历史重放</span></h1>
  <p>原型 B：按决策事件组织，事件内逐年"说 / 做"对照</p>
</header>

<nav id="nav"></nav>
<main id="main"></main>

<footer class="site">
  事件按因果跨度分章，不按年份 · 原话与数字并列陈列，不作评判 · 2025 年内容取自真实年报，早年为示意
</footer>

<script>
const events = [
  {
    id: "oversea", title: "生态出海", meta: "2021 年起 · 尚未完结",
    beats: [
      { y: 2021,
        say: "加速向全球化智能科技公司转型。",
        saySrc: "2021 年年报 · 董事长致辞（示意）",
        did: "海外收入 <b>161.4 亿元</b>，占营收约 12%。",
        didSrc: "2021 年年报 · 分部资料（示意）" },
      { y: 2024,
        say: "从产品出海迈向生态出海，深耕海外本地化运营。",
        saySrc: "2024 年年报 · 董事长致辞（示意）",
        did: "海外销量 <b>45.41 万辆</b>；海外收入 <b>811.46 亿元</b>。",
        didSrc: "2025 年年报 · 业务回顾（上年同期数）" },
      { y: 2025,
        say: "以「生态出海」模式替代单纯产品输出，实现研、产、供、销、服全产业链深耕。",
        saySrc: "2025 年年报 · 董事长致辞 · <a href='#'>原文 ↗</a>",
        did: "海外销量 <b>50.68 万辆</b>（+11.60%）；海外收入 <b>923.95 亿元</b>，占营收 <b>41.5%</b>；巴西全工艺工厂 8 月投产。",
        didSrc: "2025 年年报 · 业务回顾 / 分部资料" },
    ],
    open: "尚未完结：2025 年报提出「持续深化拉美市场布局」，其结果将在 2026 年年报中呈现。"
  },
  {
    id: "channel", title: "渠道变革：直连用户", meta: "2025 年起 · 尚未完结",
    beats: [
      { y: 2025,
        say: "加速构建直连用户的新渠道模式，以及加大新车型、新技术的上市宣传及品牌提升。",
        saySrc: "2025 年年报 · 销售费用变动说明 · <a href='#'>原文 ↗</a>",
        did: "销售费用 <b>112.73 亿元</b>，同比 <b>+43.93%</b>；销售费用率 <b>5.06%</b>（上年 3.87%）；毛利率 <b>18.04%</b>（上年 19.51%）。",
        didSrc: "2025 年年报 · 财务回顾" },
    ],
    open: "尚未完结：直营渠道投入与毛利变化的关系，待后续年份数据呈现。"
  },
  {
    id: "nev", title: "新能源转型", meta: "2022 年起 · 尚未完结",
    beats: [
      { y: 2022,
        say: "以新能源、智能化为核心方向，全面重构产品矩阵。",
        saySrc: "2022 年年报 · 管理层讨论与分析（示意）",
        did: "当年归母净利润 <b>82.66 亿元</b>，扣非 <b>44.76 亿元</b>。",
        didSrc: "2025 年年报 · 近五年主要会计数据" },
      { y: 2025,
        say: "锁定智能新能源赛道，旗下品牌市场影响力持续提升。",
        saySrc: "2025 年年报 · 董事长致辞 · <a href='#'>原文 ↗</a>",
        did: "新能源销量 <b>40.60 万辆</b>（+26.00%），占总销量 <b>30.7%</b>；新能源车收入 <b>814.77 亿元</b>。",
        didSrc: "2025 年年报 · 新能源汽车业务" },
    ],
    open: "尚未完结：归元平台于 2026 年初推出，其产出尚未进入任何年报。"
  },
];

const nav = document.getElementById("nav");
const main = document.getElementById("main");

events.forEach((ev, i) => {
  const b = document.createElement("button");
  b.textContent = ev.title;
  b.onclick = () => show(i);
  nav.appendChild(b);

  const sec = document.createElement("section");
  sec.className = "event";
  sec.innerHTML = `
    <h2>${ev.title}</h2>
    <div class="meta">${ev.meta}</div>
    ${ev.beats.map(t => `
      <div class="beat">
        <div class="y">${t.y}</div>
        <div>
          <blockquote>${t.say}<footer>${t.saySrc}</footer></blockquote>
          <div class="did">${t.did}<span class="src">${t.didSrc}</span></div>
        </div>
      </div>`).join("")}
    <div class="open">${ev.open}</div>`;
  main.appendChild(sec);
});

function show(i) {
  nav.querySelectorAll("button").forEach((b, j) => b.classList.toggle("on", i === j));
  main.querySelectorAll(".event").forEach((s, j) => s.classList.toggle("on", i === j));
}
show(0);
</script>

</body>
</html>
