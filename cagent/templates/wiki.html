<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<style>
  :root { --ink:#1f2328; --mute:#656d76; --line:#e5e7eb; --bg:#fff; --panel:#f6f8fa; --accent:#0969da; }
  * { margin:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; font-size:14px; line-height:1.65; }

  .topbar { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; padding:10px 24px; }
  .topbar b { font-size:14px; }
  .topbar span { color:var(--mute); font-size:12px; }

  .layout { display:flex; max-width:1200px; margin:0 auto; }
  aside { width:200px; flex:none; padding:20px 16px 40px 24px; position:sticky; top:41px; align-self:flex-start; }
  aside .nav-title { font-size:11px; color:var(--mute); letter-spacing:.08em; margin-bottom:8px; }
  aside a { display:block; color:var(--mute); text-decoration:none; font-size:13px; padding:3px 0 3px 10px; border-left:2px solid transparent; }
  aside a:hover { color:var(--ink); }
  aside a.sub { padding-left:22px; font-size:12.5px; }
  aside a:target { color:var(--accent); border-left-color:var(--accent); }

  main { flex:1; min-width:0; padding:16px 32px 60px 8px; max-width:920px; }

  h2 { font-size:16px; font-weight:600; margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line); scroll-margin-top:56px; }
  h2:first-child { margin-top:8px; }
  h3 { font-size:13.5px; font-weight:600; margin:18px 0 6px; scroll-margin-top:56px; }
  p { margin:8px 0; text-align:justify; }
  ul, ol { margin:6px 0 10px; padding-left:24px; }

  table { width:100%; border-collapse:collapse; font-size:13px; margin:6px 0 10px; }
  th { text-align:left; font-weight:500; font-size:12px; color:var(--mute); border-bottom:1px solid var(--ink); padding:5px 8px 5px 0; white-space:nowrap; }
  td { border-bottom:1px solid var(--line); padding:5px 8px 5px 0; vertical-align:top; }
  td.n { font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right; padding-right:6px; }
  th:not(:first-child) { text-align:right; padding-right:6px; }
  td.src, td .src { color:var(--mute); font-size:12px; white-space:nowrap; }
  td.q { color:#2c2a26; }
  tr.hl td { background:var(--panel); }
  tr.sub td { background:var(--panel); font-weight:600; border-top:1px solid var(--ink); }
  tr.comp td:first-child { padding-left:20px; }
  tr.min td { color:var(--mute); }
  tr.grp td { border-bottom:none; color:var(--mute); font-size:12px; padding-top:10px; }

  .stats td:first-child { color:var(--mute); font-weight:400; }
  .stats tr.hl td:first-child { color:var(--ink); font-weight:600; }

  .nums { display:flex; flex-wrap:wrap; gap:1px; background:var(--line); border:1px solid var(--line); margin:10px 0; }
  .nums div { background:var(--bg); padding:8px 14px; min-width:140px; flex:1; }
  .nums dt { font-size:11.5px; color:var(--mute); }
  .nums dd { font-size:16px; font-variant-numeric:tabular-nums; font-weight:600; }
  .nums dd small { font-size:11px; color:var(--mute); font-weight:400; margin-left:4px; }

  .prose p { margin:8px 0; font-size:14px; text-align:justify; }

  .years { display:flex; gap:10px; align-items:flex-start; margin:10px 0; }
  .year { flex:1; min-width:0; }
  .year > b { display:block; font-size:12.5px; color:var(--mute); font-weight:600; border-bottom:1px solid var(--ink); padding-bottom:3px; margin-bottom:2px; }
  .year table { margin:0; font-size:12.5px; }
  .year td { padding:3px 4px 3px 0; }
  .year td.n, .year td.src { text-align:right; white-space:nowrap; }

  .chain { display:flex; align-items:stretch; margin:10px 0 6px; }
  .chain .step { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 7px; font-size:11.5px; color:#2c2a26; }
  .chain .step b { display:block; text-align:center; font-size:12.5px; color:var(--ink); margin-bottom:2px; }
  .chain .to { flex:none; align-self:center; color:var(--mute); padding:0 2px; font-size:13px; }
  .return { border:1px dashed var(--line); border-radius:6px; padding:5px 10px; margin:0 0 8px; font-size:12px; color:var(--mute); text-align:center; }
  .note { background:var(--panel); border-radius:6px; padding:8px 12px; margin:10px 0; color:var(--mute); font-size:12.5px; }
  .note b { color:var(--ink); font-variant-numeric:tabular-nums; }

  .copy-btn { margin-left:auto; font-size:12.5px; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 14px; cursor:pointer; font-family:inherit; }
  .copy-btn:hover { border-color:var(--accent); color:var(--accent); }

  footer.site { max-width:1200px; margin:0 auto; padding:14px 32px 40px 232px; color:var(--mute); font-size:12px; border-top:1px solid var(--line); }
  @media (max-width:860px) { aside { display:none; } footer.site { padding-left:32px; }
    .chain { flex-direction:column; gap:4px; } .chain .to { transform:rotate(90deg); padding:0; }
    .years { flex-wrap:wrap; } .year { flex:1 1 40%; } }
</style>
</head>
<body>

<div class="topbar"><b>{topbar}</b><span>{ticker}</span><button class="copy-btn" onclick="copyReport(this)">复制全文与估值 Prompt</button></div>

<div class="layout">
<aside>
  <div class="nav-title">目录</div>
<!--NAV-->
</aside>

<main>

<!--SECTIONS-->

</main>
</div>

<footer class="site">
{footer}
</footer>

<script>
var VALUATION_PROMPT = [
  '以下是一家中国上市公司的研究报告全文（历年年报合并口径，单位：亿元人民币），只陈列数据，不含估值结论。',
  '请用巴菲特、芒格、李录的价值投资框架为其估值：取正常化利润并说明口径与周期位置；按 10% 左右资本成本折算；加净现金类资产（本报告只有利润数据，请依年报资产负债表自行计算）；只有增量资本回报持续高于资本成本时才为成长付费。给出区间而非单点，估值是假设下的推演，不是结论。',
  '—— 报告全文 ——'
].join('\n');

function reportText() {
  var main = document.querySelector('main');
  var out = [document.querySelector('.topbar b').textContent.trim()];
  main.querySelectorAll(':scope > *').forEach(function (el) {
    if (el.tagName === 'H2') { out.push('\n## ' + el.textContent.trim()); }
    else if (el.tagName === 'H3') { out.push('\n### ' + el.textContent.trim()); }
    else if (el.tagName === 'TABLE') {
      el.querySelectorAll('tr').forEach(function (tr) {
        var cells = Array.prototype.map.call(tr.querySelectorAll('th,td'), function (c) { return c.textContent.trim(); });
        out.push(cells.join(' | '));
      });
    }
    else {
      var t = el.textContent.replace(/\s+/g, ' ').trim();
      if (t) out.push(t);
    }
  });
  return out.join('\n');
}

function copyReport(btn) {
  var text = VALUATION_PROMPT + '\n\n' + reportText();
  function done() {
    var old = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(function () { btn.textContent = old; }, 1500);
  }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else { fallback(); }
}
</script>

</body>
</html>
