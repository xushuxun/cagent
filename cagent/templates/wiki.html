<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<style>
  :root { --ink:#1f2328; --mute:#656d76; --line:#e5e7eb; --bg:#fff; --panel:#f6f8fa; --accent:#0969da; }
  * { margin:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }

  .topbar { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; padding:10px 24px; }
  .topbar b { font-size:14px; }
  .topbar span { color:var(--mute); font-size:12px; }
  .copy-btn { margin-left:auto; font:12.5px inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 14px; cursor:pointer; }
  .copy-btn:hover { border-color:var(--accent); color:var(--accent); }

  main { max-width:920px; margin:0 auto; padding:16px 32px 60px; }

  h1 { font-size:15px; font-weight:600; margin:26px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--line); scroll-margin-top:56px; }
  h4 { font-size:13.5px; font-weight:600; margin:18px 0 6px; scroll-margin-top:56px; }

  .mod p { margin:8px 0; font-size:14px; text-align:justify; }
  .mod ul, .mod ol { margin:6px 0 10px; padding-left:24px; }
  .mod table { width:100%; border-collapse:collapse; font-size:13px; margin:6px 0 10px; }
  .mod th { text-align:left; font-weight:500; font-size:12px; color:var(--mute); border-bottom:1px solid var(--ink); padding:5px 8px 5px 0; }
  .mod td { border-bottom:1px solid var(--line); padding:5px 8px 5px 0; vertical-align:top; }
</style>
</head>
<body>

<div class="topbar"><b>{{ title }}</b><span>{{ ticker }}</span><button class="copy-btn" onclick="copyReport(this)">复制全文与估值 Prompt</button></div>

<main>
{{ body }}
</main>

<script>
var COPY_TEXT = {{ copy_json }};
function copyReport(btn) {
  function done() {
    var old = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(function () { btn.textContent = old; }, 1500);
  }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = COPY_TEXT; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(COPY_TEXT).then(done, fallback);
  } else { fallback(); }
}
</script>

</body>
</html>
